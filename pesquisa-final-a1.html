<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Pesquisa de Conclusão - Módulo A1 | Enlace Brasil</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f4;
    color: #333;
    padding: 24px 12px;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    border-radius: 14px;
    border-top: 6px solid #0d3b6e;
    padding: 32px 28px;
  }
  .logo-img { height: 60px; display: block; margin: 0 auto 10px auto; }
  h1 {
    text-align: center;
    color: #0d3b6e;
    font-size: 21px;
    margin: 0 0 4px 0;
  }
  .subtitulo {
    text-align: center;
    color: #666;
    font-size: 13px;
    margin: 0 0 26px 0;
  }
  .pergunta {
    margin-bottom: 22px;
  }
  .pergunta label {
    display: block;
    font-size: 14.5px;
    font-weight: bold;
    color: #0d3b6e;
    margin-bottom: 8px;
  }
  input[type="text"], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    font-family: Arial, sans-serif;
  }
  textarea { resize: vertical; min-height: 60px; }
  .escala {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .escala label {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 1.5px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
    font-weight: normal;
    cursor: pointer;
    color: #333;
    margin-bottom: 0;
  }
  .escala input[type="radio"] { display: none; }
  .escala input[type="radio"]:checked + label {
    background: #1a9a8a;
    border-color: #1a9a8a;
    color: #fff;
  }
  .escala-item { display: flex; }
  .sim-nao { display: flex; gap: 12px; }
  .sim-nao-op {
    flex: 1;
    text-align: center;
    padding: 10px;
    border: 1.5px solid #ccc;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: #333;
  }
  .sim-nao input[type="radio"] { display: none; }
  .sim-nao input[type="radio"]:checked + label {
    background: #f5c842;
    border-color: #f5c842;
    color: #0d3b6e;
    font-weight: bold;
  }
  button {
    width: 100%;
    background: #0d3b6e;
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { background: #1a9a8a; }
  .rodape {
    text-align: center;
    font-size: 11px;
    color: #999;
    margin-top: 16px;
  }
</style>
</head>

  <h1>Pesquisa de Conclusão — Módulo A1</h1>
  <p class="subtitulo">Sua opinião ajuda a melhorar o curso. Leva menos de 2 minutos.</p>

  <form id="formPesquisa">

    <div class="pergunta">
      <label for="nome">Seu nome completo</label>
      <input type="text" id="nome" required>
    </div>

    <div class="pergunta">
      <label>De 1 a 10, qual nota você dá para o curso em geral?</label>
      <div class="escala" id="escalaCurso"></div>
    </div>

    <div class="pergunta">
      <label>De 1 a 10, qual nota você dá para a professora?</label>
      <div class="escala" id="escalaProf"></div>
    </div>

    <div class="pergunta">
      <label>O que você mais gostou no curso?</label>
      <textarea id="gostou"></textarea>
    </div>

    <div class="pergunta">
      <label>O que poderia melhorar?</label>
      <textarea id="melhorar"></textarea>
    </div>

    <div class="pergunta">
      <label>Você recomendaria o curso para outra pessoa?</label>
      <div class="sim-nao">
        <div class="sim-nao-op">
          <input type="radio" name="recomenda" id="recSim" value="Sim">
          <label for="recSim" style="border:none;padding:0;">Sim</label>
        </div>
        <div class="sim-nao-op">
          <input type="radio" name="recomenda" id="recNao" value="Não">
          <label for="recNao" style="border:none;padding:0;">Não</label>
        </div>
      </div>
    </div>

    <div class="pergunta">
      <label>Comentários adicionais (opcional)</label>
      <textarea id="comentarios"></textarea>
    </div>

    <button type="submit">Enviar respostas pelo WhatsApp</button>
  </form>

  <p id="linkAlternativo" style="display:none; text-align:center; margin-top:14px;">
    <a id="linkWpp" href="#" style="color:#1a9a8a; font-weight:bold; font-size:14px;" target="_blank" rel="noopener">Se não abriu automaticamente, toque aqui para enviar pelo WhatsApp</a>
  </p>

  <div class="rodape">Enlace Brasil — Instituto de Língua e Cultura Brasileira</div>
</div>

<script>
  function criarEscala(containerId, name) {
    var el = document.getElementById(containerId);
    for (var i = 1; i <= 10; i++) {
      var wrap = document.createElement('div');
      wrap.className = 'escala-item';
      var input = document.createElement('input');
      input.type = 'radio';
      input.name = name;
      input.id = name + i;
      input.value = i;
      if (i === 10) { /* nao obrigatorio */ }
      var label = document.createElement('label');
      label.setAttribute('for', name + i);
      label.textContent = i;
      wrap.appendChild(input);
      wrap.appendChild(label);
      el.appendChild(wrap);
    }
  }
  criarEscala('escalaCurso', 'notaCurso');
  criarEscala('escalaProf', 'notaProf');

  document.getElementById('formPesquisa').addEventListener('submit', function (e) {
    e.preventDefault();

    var nome = document.getElementById('nome').value;
    var notaCurso = document.querySelector('input[name="notaCurso"]:checked');
    var notaProf = document.querySelector('input[name="notaProf"]:checked');
    var gostou = document.getElementById('gostou').value;
    var melhorar = document.getElementById('melhorar').value;
    var recomenda = document.querySelector('input[name="recomenda"]:checked');
    var comentarios = document.getElementById('comentarios').value;

    var texto = "*Pesquisa de Conclusão - Módulo A1*%0A%0A";
    texto += "*Nome:* " + encodeURIComponent(nome) + "%0A";
    texto += "*Nota do curso:* " + (notaCurso ? notaCurso.value : "-") + "%0A";
    texto += "*Nota da professora:* " + (notaProf ? notaProf.value : "-") + "%0A";
    texto += "*O que mais gostou:* " + encodeURIComponent(gostou || "-") + "%0A";
    texto += "*O que poderia melhorar:* " + encodeURIComponent(melhorar || "-") + "%0A";
    texto += "*Recomendaria:* " + (recomenda ? recomenda.value : "-") + "%0A";
    texto += "*Comentários:* " + encodeURIComponent(comentarios || "-");

    var numeroWhatsApp = "5215573217496";
    var url = "https://wa.me/" + numeroWhatsApp + "?text=" + texto;

    document.getElementById('linkWpp').href = url;
    document.getElementById('linkAlternativo').style.display = 'block';

    window.location.href = url;
  });
</script>
